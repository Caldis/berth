name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest] # macos: GH-115 T0 — 重构密集期补 mac 集成信号 (主开发平台)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @berth/scan-engine typecheck
      - run: pnpm --filter @berth/scan-engine test # scan-engine unit + CLI E2E golden net
      - run: pnpm --filter @berth/scan-engine build # smoke: engine package + CLI bundle
      - run: pnpm harness:check
      - run: pnpm build # smoke: production build must succeed
      - run: pnpm test:e2e
        if: matrix.os != 'ubuntu-latest' # ubuntu 无显示服务; project-scope e2e 在 mac 按已知 issue 文件内 skip
