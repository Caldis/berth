name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Phase 1: Test gate ──────────────────────────────────────────
  # ci.yml 套件减 e2e (macOS teardown flaky 不得卡发布; e2e 由常规 CI 覆盖)。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @berth/scan-engine typecheck
      - run: pnpm --filter @berth/scan-engine test
      - run: pnpm --filter @berth/scan-engine build
      - run: pnpm build

  # ── Phase 2: Multi-platform build ──────────────────────────────
  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 让所有平台都跑完, 一次看全失败面
      matrix:
        include:
          - os: windows-latest
            platform: win
            builder_args: --win --x64
            expected: '*.exe'
          - os: macos-latest
            platform: mac
            builder_args: --mac
            expected: '*.dmg'
          - os: ubuntu-latest
            platform: linux
            builder_args: --linux
            expected: '*.AppImage'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # publish 恒 never — 发布动作集中在 publish job。win/linux 无签名。
      - name: Package (win/linux, no publish)
        if: matrix.platform != 'mac'
        run: pnpm exec electron-builder ${{ matrix.builder_args }} --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # mac 签名 + 公证 (GH-134, 参考 bobcorn); 需仓库配置 5 个 secret。
      - name: Package (mac, signed + notarized, no publish)
        if: matrix.platform == 'mac'
        run: pnpm exec electron-builder ${{ matrix.builder_args }} --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Validate build output
        shell: bash
        run: |
          set -euo pipefail
          FILES=$(find dist/ -maxdepth 1 -name "${{ matrix.expected }}" | head -5)
          if [ -z "$FILES" ]; then
            echo "::error::No artifact matching ${{ matrix.expected }}"
            ls -la dist/ || true
            exit 1
          fi
          YML=$(find dist/ -maxdepth 1 -name 'latest*.yml' | head -1)
          if [ -z "$YML" ]; then
            echo "::error::latest*.yml missing — electron-updater feed not generated"
            exit 1
          fi
          echo "$FILES"; echo "$YML"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*-mac.zip
            dist/*-mac.zip.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
          retention-days: 7

  # ── Phase 3: Publish (仅当全部平台成功) ─────────────────────────
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: false
      - name: Validate all platforms present
        run: |
          set -euo pipefail
          find artifacts/ -type f | sort
          MISSING=""
          find artifacts/release-win/ -name "*.exe" | grep -q . || MISSING="$MISSING win(.exe)"
          find artifacts/release-win/ -name "latest.yml" | grep -q . || MISSING="$MISSING win(latest.yml)"
          find artifacts/release-mac/ -name "*.dmg" | grep -q . || MISSING="$MISSING mac(.dmg)"
          find artifacts/release-mac/ -name "*-mac.zip" | grep -q . || MISSING="$MISSING mac(.zip)"
          find artifacts/release-mac/ -name "latest-mac.yml" | grep -q . || MISSING="$MISSING mac(latest-mac.yml)"
          find artifacts/release-linux/ -name "*.AppImage" | grep -q . || MISSING="$MISSING linux(.AppImage)"
          find artifacts/release-linux/ -name "latest-linux.yml" | grep -q . || MISSING="$MISSING linux(latest-linux.yml)"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing platform artifacts:$MISSING"
            exit 1
          fi
          echo "All platforms verified."
      - name: Generate changelog
        run: |
          set -euo pipefail
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "$(echo "${GITHUB_REF#refs/tags/}")" | head -1 || true)
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          echo "## What's Changed" > changelog.md
          echo "" >> changelog.md
          if [ -n "$PREV_TAG" ]; then
            FEATS=$(git log ${PREV_TAG}..${CURRENT_TAG} --pretty=format:"- %s" --grep="^feat" || true)
            FIXES=$(git log ${PREV_TAG}..${CURRENT_TAG} --pretty=format:"- %s" --grep="^fix" || true)
            OTHER=$(git log ${PREV_TAG}..${CURRENT_TAG} --pretty=format:"- %s" --grep="^refactor\|^perf\|^security" || true)
            [ -n "$FEATS" ] && { echo "### Features" >> changelog.md; echo "$FEATS" >> changelog.md; echo "" >> changelog.md; }
            [ -n "$FIXES" ] && { echo "### Bug Fixes" >> changelog.md; echo "$FIXES" >> changelog.md; echo "" >> changelog.md; }
            [ -n "$OTHER" ] && { echo "### Other Changes" >> changelog.md; echo "$OTHER" >> changelog.md; echo "" >> changelog.md; }
            if [ -z "$FEATS" ] && [ -z "$FIXES" ] && [ -z "$OTHER" ]; then
              echo "- Bug fixes and improvements" >> changelog.md
            fi
          else
            echo "Initial release." >> changelog.md
          fi
          echo "" >> changelog.md
          echo "_Windows/Linux builds are unsigned; macOS builds are signed & notarized (auto-update enabled on all platforms)._" >> changelog.md
          cat changelog.md
      - name: Create release and upload all assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF#refs/tags/}
          # 清理上次失败 run 留下的同 tag draft / 已发布 release (重跑场景)
          DRAFT_IDS=$(gh api repos/${{ github.repository }}/releases --jq "[.[] | select(.draft==true and .tag_name==\"${TAG}\")] | .[].id" || true)
          for DID in $DRAFT_IDS; do gh api repos/${{ github.repository }}/releases/${DID} -X DELETE || true; done
          gh release delete "${TAG}" --yes 2>/dev/null || true
          PRERELEASE_FLAG=""
          case "${TAG}" in *-beta*|*-alpha*) PRERELEASE_FLAG="--prerelease" ;; esac
          gh release create "${TAG}" ${PRERELEASE_FLAG} --title "Berth ${TAG#v}" --notes-file changelog.md
          find artifacts/ -type f \( \
            -name "*.exe" -o -name "*.exe.blockmap" \
            -o -name "*.dmg" -o -name "*.dmg.blockmap" \
            -o -name "*-mac.zip" -o -name "*-mac.zip.blockmap" \
            -o -name "*.AppImage" -o -name "*.deb" \
            -o -name "latest*.yml" \
          \) -print0 | while IFS= read -r -d '' f; do
            echo "Uploading $(basename "$f")"
            gh release upload "${TAG}" "$f" --clobber
          done
      - name: Verify release integrity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF#refs/tags/}
          ASSETS=$(gh release view "${TAG}" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          ERRORS=""
          echo "$ASSETS" | grep -q '\.exe$'        || ERRORS="$ERRORS [MISSING .exe]"
          echo "$ASSETS" | grep -q '\.dmg$'        || ERRORS="$ERRORS [MISSING .dmg]"
          echo "$ASSETS" | grep -q '\-mac\.zip$'   || ERRORS="$ERRORS [MISSING mac.zip]"
          echo "$ASSETS" | grep -q '\.AppImage$'   || ERRORS="$ERRORS [MISSING .AppImage]"
          echo "$ASSETS" | grep -q '^latest\.yml$'      || ERRORS="$ERRORS [MISSING latest.yml]"
          echo "$ASSETS" | grep -q '^latest-mac\.yml$'  || ERRORS="$ERRORS [MISSING latest-mac.yml]"
          echo "$ASSETS" | grep -q '^latest-linux\.yml$'|| ERRORS="$ERRORS [MISSING latest-linux.yml]"
          if [ -n "$ERRORS" ]; then
            echo "::error::Release integrity failed:$ERRORS"
            exit 1
          fi
          echo "Release ${TAG} verified."
