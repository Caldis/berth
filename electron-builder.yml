appId: com.berth.app
productName: Berth
directories:
  buildResources: build
# GH-115 T11: 加法白名单 — 黑名单模式自脚手架后未维护, 曾把 website 源码/.agents/.claude
# 内部工作流配置/lock 文件全部打进分发包 (信息外泄 + 16% 体积), 且维护成本随仓库增长。
# better-sqlite3 原生模块由 electron-builder smartUnpack 自动处理, 无需 asarUnpack 配置。
files:
  - 'out/**'
  - 'package.json'
  - 'LICENSE'
win:
  executableName: berth
  icon: assets/icon/app_icon.png
  sign: false
  target:
    - nsis
    - portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# GH-134 签名发布策略 (参考 bobcorn): 移除 identity:null, 让 electron-builder 从
# CSC_LINK (base64 Developer ID Application .p12) 自动发现签名身份; notarize:true 走
# 内置 notarytool (APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID env)。无需
# 自定义 entitlements — 默认 hardenedRuntime + electron 默认 entitlements 已够 (bobcorn
# 同样无自定义 plist)。CI 注入的 5 个 secret 见 release.yml: MAC_CERTS /
# MAC_CERTS_PASSWORD / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID。
# 本机无凭据时本地打包: `CSC_IDENTITY_AUTO_DISCOVERY=false pnpm package:mac` (产未签名包,
# 自动跳过 notarize)。mac 更新源是 zip (Squirrel.Mac), dmg 仅供人工下载; 双架构覆盖
# Intel + Apple Silicon。
mac:
  icon: assets/icon/app_icon.png
  notarize: true
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: assets/icon/app_icon.png
  # .deb 强制要求 maintainer; 缺失会让整个 linux 打包失败 (GH-134 beta.1 dry-run 实测)。
  maintainer: Caldis <cn@caldis.me>
  target:
    - AppImage
    - deb
  category: Utility
npmRebuild: false
# GH-124: provider 配置驱动 latest*.yml 生成 (electron-updater 数据源); 发布动作
# 本身由 release.yml 的 publish job 经 gh CLI 执行, builder 恒 --publish never。
publish:
  provider: github
  owner: Caldis
  repo: berth
