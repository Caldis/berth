appId: com.berth.app
productName: Berth
directories:
  buildResources: build
# GH-115 T11: 加法白名单 — 黑名单模式自脚手架后未维护, 曾把 website 源码/.agents/.claude
# 内部工作流配置/lock 文件全部打进分发包 (信息外泄 + 16% 体积), 且维护成本随仓库增长。
# better-sqlite3 原生模块由 electron-builder smartUnpack 自动处理, 无需 asarUnpack 配置。
files:
  - 'out/**'
  - 'package.json'
  - 'LICENSE'
win:
  executableName: berth
  icon: assets/icon/app_icon.png
  sign: false
  target:
    - nsis
    - portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# 未签名发布策略 (issue macos-release-signing-config): identity null 固定禁用签名
# 自动发现 — 钥匙串有身份的机器上, 自动签名会撞曾指向不存在 entitlements 文件的
# 配置而阻断打包。改为签名发布时: 补 build/entitlements.mac.plist + 证书配置, 移除 identity。
mac:
  identity: null
  icon: assets/icon/app_icon.png
  target:
    - dmg
    - zip
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: assets/icon/app_icon.png
  target:
    - AppImage
    - deb
  category: Utility
npmRebuild: false
